
name: Verify developer kit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify published files
        run: sha256sum -c SHA256SUMS
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Compile independent sample and R8 release
        run: ./gradlew -p sample :app:assembleDebug :app:assembleRelease --no-daemon
